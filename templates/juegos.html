{% extends './layout.html' %}

{% block title %} Juegos {% endblock %}

{% block body %}

<h3>Juegos</h3>
<a href="{{url_for('formularioagregarjuego')}}" >Agregar</a>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    {% for juego in juegos %}
                    <tr>
                        <td>{{juego[1]}}</td>
                        <td>{{juego[2]}}</td>
                        <td>{{juego[3]}}</td>
                        <td>
            <a href="{{url_for('editar_juego', id=juego[0])}}">Editar</a>
                        </td>
                        <td>
                            <form action="{{url_for('eliminar_juego')}}" method="post">
                                <input type="hidden" name="id" value="{{juego[0]}}">
                                <button>Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
{% endblock %}
