{% extends './layout.html' %}

{% block title %} Editar Juego {% endblock %}

{% block body %}

            <h3>Editar Juegos</h3>
            <form action="{{url_for('actualizar_j')}}" method="post">
                <input type="hidden" name="id" value="{{juego[0]}}">
                <label for="nombre">Nombre:</label>
                <input value="{{juego[1]}}" required type="text" placeholder="Nombre" name="nombre">
                <label for="descripcion">Descripción</label>
                <input value="{{juego[2]}}" required type="text" placeholder="Descripción" name="descripcion">
                <label for="precio">Precio</label>
                <input value="{{juego[3]}}" required type="number" placeholder="Precio" name="precio">
                <button type="submit">Guardar</button>
                <a href="{{url_for('juegos')}}" >Volver</a>
            </form>


{% endblock %}
